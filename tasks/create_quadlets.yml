---
- name: 'create {{ container_path }}'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env}}'
  ansible.builtin.file:
    path: '{{ container_path }}'
    state: directory
    mode: '0755'
  tags:
    - install

- name: 'create volume quadlets'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env}}'
  ansible.builtin.template:
    src: volume.j2
    dest: '{{ container_path }}/{{ item.name }}.volume'
    mode: '0644'
  loop: '{{ service_pod.named_volumes }}'
  tags:
    - install

- name: 'create image quadlets'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env}}'
  ansible.builtin.template:
    src: image.j2
    dest: '{{ container_path }}/{{ container.name }}.image'
    mode: '0644'
  loop: '{{ service_pod.containers }}'
  loop_control:
    loop_var: containers
  tags:
    - install

- name: 'create container quadlets'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env}}'
  ansible.builtin.template:
    src: container.j2
    dest: '{{ container_path }}/{{ container.name }}.container'
    mode: '0644'
  loop: '{{ service_pod.containers }}'
  loop_control:
    loop_var: containers
  tags:
    - install

- name: 'create pod quadlet'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env}}'
  ansible.builtin.template:
    src: pod.j2
    dest: '{{ container_path }}/{{ service_pod.name }}.pod'
    mode: '0644'
  tags:
    - install

- name: 'run daemon-reload'
  become: true
  become_user: '{{ username }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ userid }}'
    DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ userid }}/bus'
  ansible.builtin.systemd_service:
    scope: 'user'
    daemon_reload: true
  tags:
    - start

- name: 'configure systemd to run pod "{{ service_pod.name }}"'
  become: true
  become_user: '{{ username }}'
  environment: '{{ become_env }}'
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
    enabled: true
    state: started
    name: '{{ service_pod.name }}-pod.service'
  tags:
    - start
