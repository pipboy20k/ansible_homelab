---
## will work for defaults.yml without containers being defined because of 'default([])'
- name: 'create directories for user {{ username }}'
  become: true
  ansible.builtin.file:
    # if dir is false, take dirname; otherwise use full path
    path: >-
      {%- set raw_path = item.1.host | replace('%h', '/home/' ~ username) -%}
      {{ (item.1.dir | default(true)) | ternary(raw_path, raw_path | dirname) }}
    state: directory
    mode: '0755'
    owner: '{{ username }}'
    group: '{{ username }}'
  loop: '{{ containers | default([]) | subelements("volumes", skip_missing=True) }}'
  tags:
    - install
      #    path: '{{ item.1.host | replace("%h", "/home/" ~ username) }}'

## will work for defaults.yml without containers being defined because of 'default([])'
- name: 'assign default ACL for directories outside of /home/{{ username }}'
  become: true
  ansible.posix.acl:
    path: '{{ item.1.host }}'
    entity: '{{ username }}'
    etype: user
    permissions: '{{ item.1.permissions }}'
    state: present
    recurse: yes
    default: yes
  loop: '{{ containers | default([]) | subelements("volumes", skip_missing=True) }}'
  when:
    - '"%h" not in item.1.host'
  tags:
    - install

## will work for defaults.yml without containers being defined because of 'default([])'
- name: 'assign current ACL for directories outside of /home/{{ username }}'
  become: true
  ansible.posix.acl:
    path: '{{ item.1.host }}'
    entity: '{{ username }}'
    etype: user
    permissions: '{{ item.1.permissions }}'
    state: present
    recurse: yes
  loop: '{{ containers | default([]) | subelements("volumes", skip_missing=True) }}'
  when:
    - '"%h" not in item.1.host'
  tags:
    - install
